plugins {
    id 'java'
}

version = project.app_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    implementation "com.google.code.gson:gson:${project.gson_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

def appJar = tasks.register('appJar', Jar) {
    archiveFileName = "clock-${project.version}.jar"
    destinationDirectory = layout.buildDirectory.dir('intermediate/nested')

    from(sourceSets.main.output) {
        exclude 'top/blueicemiaow/clock/bootstrap/**'
    }

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

def jarInJar = tasks.register('jarInJar', Jar) {
    dependsOn appJar

    group = 'build'
    description = 'Builds the runnable jar with nested application and Gson jars.'

    archiveFileName = "${project.archives_base_name}-${project.version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')

    manifest {
        attributes(
                'Main-Class': 'top.blueicemiaow.clock.bootstrap.Bootstrap',
                'Implementation-Title': 'Simple Clock',
                'Implementation-Version': project.version
        )
    }

    from(sourceSets.main.output) {
        include 'top/blueicemiaow/clock/bootstrap/**'
    }

    from(appJar.flatMap { it.archiveFile }) {
        into 'META-INF/jars'
    }

    from({ configurations.runtimeClasspath.filter { it.isFile() && it.name.endsWith('.jar') } }) {
        into 'META-INF/jars'
    }

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    withSourcesJar()
}

tasks.named('jar', Jar) {
    enabled = false
}

tasks.named('assemble') {
    dependsOn jarInJar
}
